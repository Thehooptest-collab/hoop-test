<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Hoop Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --court:#0B0E14;
  --court2:#131826;
  --line:#232A3E;
  --ball:#E3A63D;
  --ball-dim:#8a6a24;
  --net:#F2EFE6;
  --net-dim:#8891A3;
  --rim:#3E7CB1;
  --miss:#D64545;
  --make:#4CAF6B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;}
body{
  margin:0;background:var(--court);color:var(--net);
  font-family:'Manrope',sans-serif;
  display:flex;justify-content:center;
  min-height:100%;
}
.wrap{width:100%;max-width:520px;padding:28px 20px 40px;}
header{text-align:center;margin-bottom:22px;}
.wordmark{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(34px,9vw,46px);letter-spacing:.5px;
  color:var(--net);margin:0;line-height:1;
}
.wordmark span{color:var(--ball);}
.sub{color:var(--net-dim);font-size:14px;margin-top:6px;}
.rim{
  height:3px;width:64px;margin:16px auto 0;
  background:linear-gradient(90deg,transparent,var(--ball),var(--rim),transparent);
}

.card{
  background:var(--court2);border:1px solid var(--line);
  border-radius:10px;padding:20px;margin-bottom:16px;
}
.hint-row{
  display:flex;gap:14px;align-items:flex-start;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.hint-row:last-child{border-bottom:none;}
.hint-cat{
  font-family:'Manrope',sans-serif;color:var(--ball);
  font-size:13px;font-weight:600;min-width:104px;flex-shrink:0;
  padding-top:1px;
}
.hint-cat.dim{color:var(--net-dim);}
.hint-text{font-size:15px;line-height:1.45;color:var(--net);}
.hint-locked{color:var(--net-dim);font-style:italic;}

.controls{display:flex;gap:10px;margin-top:16px;}
button{
  font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;
  border:none;border-radius:7px;padding:12px 16px;cursor:pointer;
  transition:transform .12s ease, background .15s ease;
}
button:active{transform:scale(.97);}
button:disabled{opacity:.4;cursor:not-allowed;}
.btn-reveal{background:var(--line);color:var(--net);flex:1;}
.btn-reveal:not(:disabled):hover{background:#2d3650;}

.guess-meta{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;font-size:12px;color:var(--net-dim);
}
.miss-pips{display:flex;gap:4px;}
.miss-pip{width:9px;height:9px;border-radius:50%;background:var(--line);}
.miss-pip.spent{background:var(--miss);}
.guess-row{display:flex;gap:8px;margin-top:6px;}
input[type=text]{
  flex:1;background:var(--court);border:1px solid var(--line);
  border-radius:7px;padding:12px;color:var(--net);font-size:15px;
  font-family:'Manrope',sans-serif;
}
input[type=text]:focus{outline:2px solid var(--ball);outline-offset:0;}
.btn-guess{background:var(--ball);color:#231502;}
.btn-guess:not(:disabled):hover{background:#edb75c;}

.status{
  margin-top:14px;padding:12px 14px;border-radius:7px;
  font-size:14px;display:none;
}
.status.show{display:block;}
.status.wrong{background:rgba(214,69,69,.15);border:1px solid var(--miss);color:#f3a3a3;}
.status.right{background:rgba(76,175,107,.15);border:1px solid var(--make);color:#a7e0b8;}

.scoreboard{text-align:center;}
.score-big{
  font-family:'Barlow Condensed',sans-serif;font-size:60px;font-weight:700;
  color:var(--ball);line-height:1;margin:4px 0;
}
.score-label{color:var(--net-dim);font-size:13px;}
.answer-name{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:22px;margin:10px 0 4px;}

.hint-track{display:flex;gap:5px;margin-top:14px;}
.pip{flex:1;height:6px;border-radius:3px;background:var(--line);}
.pip.on{background:var(--ball);}

.share-btn{
  width:100%;margin-top:14px;background:var(--net);color:var(--court);
}
.footer-note{text-align:center;color:var(--net-dim);font-size:12px;margin-top:18px;}
.stats-line{display:none;color:var(--net-dim);font-size:13px;margin-top:10px;}
.ad-slot{
  background:var(--court2);border:1px dashed var(--line);border-radius:8px;
  text-align:center;color:var(--net-dim);font-size:12px;
  padding:18px 12px;margin:16px 0;min-height:90px;
  display:flex;align-items:center;justify-content:center;
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="wordmark">THE HOOP<span>TEST</span></h1>
    <div class="sub" id="dateLabel">Daily NBA Trivia</div>
    <div class="rim"></div>
  </header>

  <div class="ad-slot" id="adTop">Ad space</div>

    <div id="hintTrack" class="hint-track"></div>
    <div id="hintList" style="margin-top:14px;"></div>

    <div class="controls">
      <button class="btn-reveal" id="revealBtn">Reveal next hint</button>
    </div>
    <div class="guess-row">
      <input type="text" id="guessInput" list="playerList" placeholder="Type a player name…" autocomplete="off">
      <button class="btn-guess" id="guessBtn">Guess</button>
    </div>
    <div class="guess-meta">
      <span id="missLabel">3 wrong guesses left</span>
      <div class="miss-pips" id="missPips"></div>
    </div>
    <datalist id="playerList"></datalist>

    <div class="status" id="statusBox"></div>
  </div>

  <div class="card scoreboard" id="resultCard" style="display:none;">
    <div class="score-label">FINAL SCORE</div>
    <div class="score-big" id="finalScore">0</div>
    <div class="answer-name" id="answerName"></div>
    <div class="stats-line" id="statsLine"></div>
    <button class="share-btn" id="shareBtn">Copy result</button>
  </div>

  <!-- AD SLOT: mid-page, only visible once a round ends so it never interrupts active play. -->
  <div class="ad-slot" id="adMid" style="display:none;">Ad space</div>

  <div class="footer-note">One player, once a day. 8 hints, scored by how few you need.</div>

  <!-- AD SLOT: footer banner. -->
  <div class="ad-slot" id="adFooter">Ad space</div>
</div>

const SCORE_TABLE = {1:100,2:90,3:80,4:70,5:60,6:45,7:30,8:15};

function dayIndexSeed(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  return Math.floor(diff/86400000);
}
const seed = dayIndexSeed();
const puzzleIndex = seed % PLAYERS.length;
const puzzle = PLAYERS[puzzleIndex];
const todayKey = new Date().toISOString().slice(0,10);
const storageKey = "hooptest_" + todayKey;

document.getElementById('dateLabel').textContent =
  new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

const dl = document.getElementById('playerList');
PLAYERS.forEach(p=>{
  const o=document.createElement('option'); o.value=p.name; dl.appendChild(o);
});

let hintsRevealed = 1;
let finished = false;
const MAX_MISSES = 3;
let missesUsed = 0;

const hintListEl = document.getElementById('hintList');
const hintTrackEl = document.getElementById('hintTrack');
const revealBtn = document.getElementById('revealBtn');
const guessInput = document.getElementById('guessInput');
const guessBtn = document.getElementById('guessBtn');
const statusBox = document.getElementById('statusBox');
const resultCard = document.getElementById('resultCard');
const missLabel = document.getElementById('missLabel');
const missPipsEl = document.getElementById('missPips');

for(let i=0;i<8;i++){
  const pip=document.createElement('div'); pip.className='pip'; hintTrackEl.appendChild(pip);
}
for(let i=0;i<MAX_MISSES;i++){
  const pip=document.createElement('div'); pip.className='miss-pip'; missPipsEl.appendChild(pip);
}

function renderMisses(){
  const left = MAX_MISSES - missesUsed;
  missLabel.textContent = finished
    ? (left<=0 ? 'Out of guesses' : left + ' wrong guess' + (left===1?'':'es') + ' left')
    : left + ' wrong guess' + (left===1?'':'es') + ' left';
  [...missPipsEl.children].forEach((pip,i)=>{
    pip.classList.toggle('spent', i < missesUsed);
  });
}

function renderHints(){
  hintListEl.innerHTML='';
  for(let i=0;i<8;i++){
    const row=document.createElement('div'); row.className='hint-row';
    const cat=document.createElement('div'); cat.className='hint-cat';
    cat.textContent=CATEGORIES[i];
    const text=document.createElement('div');
    if(i < hintsRevealed){
      text.className='hint-text'; text.textContent=puzzle.hints[i];
    } else {
      cat.classList.add('dim');
      text.className='hint-text hint-locked'; text.textContent='Locked';
    }
    row.appendChild(cat); row.appendChild(text); hintListEl.appendChild(row);
  }
  [...hintTrackEl.children].forEach((pip,i)=>{
    pip.classList.toggle('on', i < hintsRevealed);
  });
  revealBtn.disabled = hintsRevealed >= 8 || finished;
}

function showStatus(msg, kind){
  statusBox.textContent = msg;
  statusBox.className = 'status show ' + kind;
}

function endGame(won, doSync){
  if(doSync === undefined) doSync = true;
  finished = true;
  guessInput.disabled = true; guessBtn.disabled = true; revealBtn.disabled = true;
  const score = won ? SCORE_TABLE[hintsRevealed] : 0;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('answerName').textContent =
    won ? ("🏀 " + puzzle.name) : ("The answer was " + puzzle.name);
  resultCard.style.display = 'block';
  document.getElementById('adMid').style.display = 'flex';
  renderMisses();
  const record = {hintsRevealed, missesUsed, won, score};
  localStorage.setItem(storageKey, JSON.stringify(record));
  if(doSync) syncOnFinish(record);
}

// ---- Cross-device sync (signed-in Claude account, optional) ----
function dayDocPath(uid){ return "data/users/" + uid + "/hooptest_results/" + todayKey; }
function statsDocPath(uid){ return "data/users/" + uid + "/hooptest_stats/main"; }

let cloudCtx = null;
async function getCloud(){
  if(cloudCtx !== null) return cloudCtx;
  try{
    const u = await claude.use("user");
    const d = await claude.use("db");
    if(!u || !d){ cloudCtx = false; return false; }
    const id = u.id();
    if(!id){ cloudCtx = false; return false; }
    cloudCtx = { user:u, db:d, uid:id };
    return cloudCtx;
  }catch(e){ cloudCtx = false; return false; }
}

function renderStatsLine(s){
  const el = document.getElementById('statsLine');
  if(!el || !s || !s.games) return;
  const avg = Math.round(s.totalScore / s.games);
  el.textContent = s.games + " played · avg " + avg + " · " + s.streak + "-day streak";
  el.style.display = 'block';
}

async function syncOnFinish(record){
  const cloud = await getCloud();
  if(!cloud) return;
  try{ await cloud.db.doc(dayDocPath(cloud.uid)).set(record); }catch(e){}
  try{
    const ref = cloud.db.doc(statsDocPath(cloud.uid));
    let prev = {};
    try{ const snap = await ref.get(); prev = (snap && snap.data) || {}; }catch(e){}
    let streak = prev.streak || 0;
    if(prev.lastDate){
      const diffDays = Math.round((new Date(todayKey) - new Date(prev.lastDate)) / 86400000);
      streak = diffDays === 1 ? streak + 1 : (diffDays === 0 ? streak : 1);
    } else { streak = 1; }
    const next = {
      games: (prev.games || 0) + 1,
      totalScore: (prev.totalScore || 0) + record.score,
      streak, lastDate: todayKey
    };
    await ref.set(next);
    renderStatsLine(next);
  }catch(e){}
}

async function syncOnLoad(localRecord){
  const cloud = await getCloud();
  if(!cloud) return;
  let cloudData = null;
  try{ const snap = await cloud.db.doc(dayDocPath(cloud.uid)).get(); cloudData = snap && snap.data; }catch(e){}
  if(cloudData && !finished){
    hintsRevealed = cloudData.hintsRevealed;
    missesUsed = cloudData.missesUsed || 0;
    renderHints();
    endGame(cloudData.won, false);
  } else if(!cloudData && localRecord){
    syncOnFinish(localRecord);
  }
  try{
    const snap = await cloud.db.doc(statsDocPath(cloud.uid)).get();
    if(snap && snap.data) renderStatsLine(snap.data);
  }catch(e){}
}

revealBtn.addEventListener('click', ()=>{
  if(hintsRevealed < 8){ hintsRevealed++; renderHints(); statusBox.classList.remove('show'); }
});

function submitGuess(){
  if(finished) return;
  const val = guessInput.value.trim().toLowerCase();
  if(!val) return;
  if(val === puzzle.name.toLowerCase()){
    showStatus('Nailed it.', 'right');
    endGame(true);
    return;
  }
  missesUsed++;
  renderMisses();
  guessInput.value = '';
  if(missesUsed >= MAX_MISSES){
    showStatus("That's your last guess used up.", 'wrong');
    endGame(false);
  } else if(hintsRevealed >= 8){
    showStatus('Out of hints too — last guess or bust.', 'wrong');
  } else {
    showStatus('Not quite — reveal another hint or guess again.', 'wrong');
  }
}
guessBtn.addEventListener('click', submitGuess);
guessInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitGuess(); });

document.getElementById('shareBtn').addEventListener('click', ()=>{
  const saved = JSON.parse(localStorage.getItem(storageKey) || '{}');
  const filled = '🟧'.repeat(saved.hintsRevealed||8) + '⬛'.repeat(8-(saved.hintsRevealed||8));
  const text = `The Hoop Test ${todayKey}\n${filled}\nScore: ${saved.score||0}/100`;
  navigator.clipboard?.writeText(text).catch(()=>{});
  const btn = document.getElementById('shareBtn');
  const old = btn.textContent; btn.textContent='Copied!';
  setTimeout(()=>btn.textContent=old, 1500);
});

let localRecord = null;
try{
  localRecord = JSON.parse(localStorage.getItem(storageKey) || 'null');
  if(localRecord){
    hintsRevealed = localRecord.hintsRevealed;
    missesUsed = localRecord.missesUsed || 0;
    renderHints();
    endGame(localRecord.won, false);
  } else {
    renderHints();
    renderMisses();
  }
}catch(e){ renderHints(); renderMisses(); }
syncOnLoad(localRecord);
</script>
</body>
</html>
